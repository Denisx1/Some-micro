version: '3.8'
services:
    redis_container:
        image: redis:alpine
        container_name: redis_container
        ports:
            - '6379:6379'
        command: [ 'redis-server', '--requirepass', 'secretpass' ]
        volumes:
            - redis-data:/data
        healthcheck:
            test: [ 'CMD', 'redis-cli', 'ping' ]
            interval: 5s
            retries: 5
        networks:
            - shared-network
    debezium:
        image: debezium/connect:2.4
        container_name: debezium
        ports:
            - '8083:8083'
        environment:
            BOOTSTRAP_SERVERS: kafka:29092
            GROUP_ID: 1
            CONFIG_STORAGE_TOPIC: _connect_configs
            OFFSET_STORAGE_TOPIC: _connect_offsets
            STATUS_STORAGE_TOPIC: _connect_statuses
            # Конвертеры: говорим, что данные в Кафку шлем в JSON
            KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
            VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
            # Отключаем схемы внутри JSON (чтобы сообщения были чистыми)
            VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
            KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
        depends_on:
            kafka:
                condition: service_healthy
        networks:
            - shared-network

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: kafka-ui
        ports:
            - '8080:8080'
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
            KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
            KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium:8083
        depends_on:
            kafka:
                condition: service_healthy
        networks:
            - shared-network

    kafka:
        image: confluentinc/cp-kafka:7.5.0
        container_name: kafka
        ports:
            - '9092:9092'
        environment:
            # --- KRaft Configuration ---
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: 'broker,controller'
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
            CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
            KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

            # --- Listeners ---
            # INTERNAL - для общения внутри docker-сети (Go -> Kafka:29092)
            # EXTERNAL - для подключения с хоста (localhost:9092)
            KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
            KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
            KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'

            # --- Dev Optimizations ---
            KAFKA_NUM_PARTITIONS: 3
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_LOG_RETENTION_HOURS: 12

        networks:
            - shared-network
        healthcheck:
            test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
            interval: 5s
            timeout: 5s
            retries: 5

networks:
    shared-network:
        external: true

volumes:
    redis-data:
