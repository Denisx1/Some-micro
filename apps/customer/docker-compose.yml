version: '3.8'
services:
  customer_postgres:
    image: postgres:18-alpine
    container_name: ${DB_CONTAINER}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command:
      [
        'postgres',
        '-c',
        'wal_level=logical',
        '-c',
        'max_replication_slots=10',
        '-c',
        'max_wal_senders=10',
      ]
    volumes:
       - ${SERVICE_DIR}/out/pgdata:/var/lib/postgresql
    restart: always   
    networks:
      - shared-network  

    
  customer-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${SERVICE_DIR}/migrations:/migrations
    networks:
      - shared-network  

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: customer-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:${DB_CONTAINER}:5432
    ports:
      - "127.0.0.1:5432:5432"  
    networks:
      - shared-network           

networks:
  shared-network:
    external: true