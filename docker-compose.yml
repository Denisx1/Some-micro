version: '3.8'
services:
  postgres_container:
    image: postgres:16-alpine
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: Role
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 5
    networks:
      - backend
  redis_container:
    image: redis:alpine
    container_name: redis_container
    ports:
      - '6380:6379'
    command: ['redis-server', '--requirepass', 'secretpass']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 5
    networks:
      - backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '2181']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    expose:
      - 2181
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKAJS_NO_PARTITIONER_WARNING: 1
    healthcheck:
      test:
        ['CMD', 'kafka-topics', '--bootstrap-server', 'kafka:9092', '--list']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - 9092
    networks:
      - backend
  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    container_name: gateway-service
    ports:
      - '3000:3000'
    networks:
      - backend
    depends_on:
      - user-service
      - role-service
    volumes:
      - ./apps/gateway:/app/apps/gateway
      - ./libs:/app/libs
      - ./nest-cli.json:/app/nest-cli.json
      - ./package.json:/app/package.json
    command: npm run start:dev -- gateway
  role-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: role
    container_name: role-service
    expose:
      - 30003
    networks:
      - backend
    depends_on:
      postgres_container:
        condition: service_healthy
    env_file:
      - ./apps/role/.env
    volumes:
      - ./apps/role:/app/apps/role
      - ./libs:/app/libs
      - ./nest-cli.json:/app/nest-cli.json
      - ./package.json:/app/package.json
    command: npm run start:dev -- role

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    container_name: auth-service
    expose:
      - 30002
    networks:
      - backend
    depends_on:
      redis_container:
        condition: service_healthy
    env_file:
      - ./apps/auth/.env
    volumes:
      - ./apps/auth:/app/apps/auth
      - ./libs:/app/libs
      - ./nest-cli.json:/app/nest-cli.json
      - ./package.json:/app/package.json
    command: npm run start:dev -- auth
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user
    container_name: user-service
    env_file:
      - ./apps/user/.env
    depends_on:
      redis_container:
        condition: service_healthy
      postgres_container:
        condition: service_healthy
      kafka:
        condition: service_healthy
    expose:
      - 30001
    networks:
      - backend
    volumes:
      - ./apps/user:/app/apps/user
      - ./libs:/app/libs
      - ./nest-cli.json:/app/nest-cli.json
      - ./package.json:/app/package.json
    command: npm run start:dev -- user
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification
    container_name: notification-service
    expose:
      - 30002
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - ./apps/notification/.env
    volumes:
      - ./apps/notification:/app/apps/notification
      - ./libs:/app/libs
      - ./nest-cli.json:/app/nest-cli.json
      - ./package.json:/app/package.json
    command: npm run start:dev -- notification

volumes:
  redis-data:
  pgdata:
networks:
  backend:
    driver: bridge
