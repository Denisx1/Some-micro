syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/Denisx1/Some-micro/pkg/pb/user/v1;userv1";

service UserService {
}
service CandidateService {
  rpc CreateCandidate(CreateRequest) returns (ActionResponse);
}
message ActionResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message CreateRequest {
    string email = 1 [(buf.validate.field).string.email = true];
    string user_name = 2 [(buf.validate.field).string = {
    min_len: 3,
    max_len: 32
    }]; 

    string password = 3 [(buf.validate.field).string = {
    min_len: 8
    }];
    string role = 4 [(buf.validate.field).string = {
    min_len: 1
    }];
}

