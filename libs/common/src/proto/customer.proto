
syntax = "proto3";
package customer_service;

service CustomerService {
    rpc GetCustomer(Customer) returns (Customer);
    rpc SubscribeNotifications (SubscribeRequest) returns (stream StreamResponse);
}
message SubscribeRequest{
  int32 customerId = 1;
}
message StreamResponse{
  string type = 1; 
  Chat chatData = 2;
}
message Chat{
  int32 orderId = 1;
  string roomId = 2;
  int32 cleanerId = 4;
  int32 customerId = 5;
}

message Customer{
    int32 id = 1; 
    int32 userId = 2;
    string firstName = 3;
    string lastName = 4;
    string createdAt = 5;
    }
message CustomerServiceResponse{
  bool success=1;
  string message=2;
  oneof response{
    Data data=3;
    ErrorDetails error=4;
  }
}
message Data{
  oneof response {
    Customer customer = 1;
  }
}
message ErrorDetails{
  int32 code = 1;     
  string field = 2;       
  string context = 4;
}
